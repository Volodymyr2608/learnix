name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "true"
      - run: pnpm check
      - run: pnpm test:unit
        env:
          SKIP_ENV_VALIDATION: "true"
          CERTIFICATE_SECRET: test-certificate-secret-at-least-32-chars-long

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnix_test
      SKIP_ENV_VALIDATION: "true"
      CERTIFICATE_SECRET: test-certificate-secret-at-least-32-chars-long
      STRIPE_SECRET_KEY: sk_test_stub
      STRIPE_WEBHOOK_SECRET: whsec_stub
      STRIPE_CONNECT_WEBHOOK_SECRET: whsec_connect_stub
      STRIPE_PLATFORM_FEE_PERCENT: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm prisma migrate deploy
      - run: pnpm test:integration
  # The tier that proves R3 is closed. Without it the ONLY adapter with
  # behavioural coverage in CI is the one production never uses: the Lua script
  # would be exercised by two indexOf assertions and a mocked eval, so a
  # one-character error in the ARGV max lookup would pass every gate and either
  # reject everything or grant an unbounded ceiling in production.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      srh:
        # @upstash/redis speaks HTTP, not the Redis wire protocol.
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: test-token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      SKIP_ENV_VALIDATION: "true"
      CERTIFICATE_SECRET: test-certificate-secret-at-least-32-chars-long
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm test:redis
