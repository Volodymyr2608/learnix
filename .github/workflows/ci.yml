name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "true"
      - run: pnpm check
      - run: pnpm test:unit
        env:
          SKIP_ENV_VALIDATION: "true"
          CERTIFICATE_SECRET: test-certificate-secret-at-least-32-chars-long

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnix_test
      SKIP_ENV_VALIDATION: "true"
      CERTIFICATE_SECRET: test-certificate-secret-at-least-32-chars-long
      STRIPE_SECRET_KEY: sk_test_stub
      STRIPE_WEBHOOK_SECRET: whsec_stub
      STRIPE_CONNECT_WEBHOOK_SECRET: whsec_connect_stub
      STRIPE_PLATFORM_FEE_PERCENT: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm prisma migrate deploy
      - run: pnpm test:integration